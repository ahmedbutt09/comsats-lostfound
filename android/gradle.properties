# 1. MEMORY & DAEMON: Increases heap size for faster builds with modern Java
# The publish.checksums.insecure=true helps bypass metadata issues with new Java versions
org.gradle.jvmargs=-Xmx2048m -Dorg.gradle.internal.publish.checksums.insecure=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 2. ANDROIDX: Required for all modern Capacitor projects
android.useAndroidX=true

# 3. JETIFIER: Converts legacy libraries to AndroidX at build time
# This is crucial for fixing "Duplicate class" errors in Cordova plugins
android.enableJetifier=true

# 4. COMPATIBILITY: Suppresses the warning for compileSdk 35 
# Use this if you are staying on AGP 8.3.2 but targeting Android 15 (API 35)
android.suppressUnsupportedCompileSdk=35

# 5. KOTLIN: Optional but recommended for modern builds
kotlin.code.style=official
# 6. TOOLCHAIN AUTO-PROVISIONING
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true