name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          CI: false
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

      # Use a dedicated Website-to-APK action that doesn't need Capacitor
      - name: Build APK
        uses: sweto-pramanik/website-to-apk-action@v1
        with:
          website-url: 'https://comsats-lostfound.vercel.app'
          app-name: 'COMSATS Lost Found'
          icon-path: './public/logo192.png' # Ensure this path is correct

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COMSATS-App
          path: ./*.apk